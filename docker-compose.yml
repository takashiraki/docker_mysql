version: "3"

services:
  db:
    image: mysql
    container_name: my_database
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - ${DB_PORT}:3306
    networks:
      - my_infra_network

volumes:
  mysql_data:

networks:
  my_infra_network:
    external: true
    name: my_infra_network
